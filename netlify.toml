[build]
  publish = "public"
  command = ""

# Rutas limpias sin extensión .html
# Netlify sirve automáticamente home.html → /home, login.html → /login, etc.

# /register sirve el mismo contenido que login.html (la página tiene toggle login/registro)
[[redirects]]
  from = "/register"
  to   = "/login.html"
  status = 200
  force  = true

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache largo para CSS/JS (inmutable con hash en nombre, o forzar revalidación)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
